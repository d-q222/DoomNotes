[project]
name = "doomnotes"
version = "0.1.0"
description = "DoomNotes — turn saved Instagram/TikTok videos into searchable Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "faster-whisper",
    "ollama",
]

[project.scripts]
doomnotes = "doomnotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
